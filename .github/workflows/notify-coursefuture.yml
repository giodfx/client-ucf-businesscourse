name: Notify CourseFuture on push

# Fires repository_dispatch on giandre/CourseFuture whenever this repo
# receives a push, so the auto-publish action regenerates HTML (if needed)
# and uploads to R2 — covering CLI/local pushes that don't go through the
# visualizer's save handler. Visualizer saves still fire their own
# dispatch directly; this just closes the gap for everything else.

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Fire repository_dispatch on giandre/CourseFuture
        env:
          DISPATCH_PAT: ${{ secrets.LX_DISPATCH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_PAT:-}" ]; then
            echo "::error::LX_DISPATCH_PAT secret not set on this repo"
            exit 1
          fi
          curl -s -f -X POST \
            -H "Authorization: Bearer $DISPATCH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/giandre/CourseFuture/dispatches \
            -d '{
              "event_type": "course-content-updated",
              "client_payload": {
                "source_repo": "${{ github.repository }}",
                "commit_sha": "${{ github.sha }}",
                "triggered_by": "${{ github.actor }}"
              }
            }'
          echo "Dispatched course-content-updated -> giandre/CourseFuture"
